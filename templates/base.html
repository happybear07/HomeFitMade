<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}홈핏 메이트{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="icon" href="{{ url_for('static', filename='img/bear/happy.svg') }}">
</head>
<body class="stage-{{ stage | default('g0') }}">
<div class="app {% block app_class %}{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-wrap" role="status">
      {% for cat, msg in messages %}
        <p class="note {{ 'note-danger' if cat == 'error' else 'note-mint' }}">{{ msg }}</p>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
