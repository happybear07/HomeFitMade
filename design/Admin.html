<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S7 관리자 · 시범 영상 · 홈핏 메이트 화면 설계</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C7460}
</style>
<style>body{margin:0;min-height:100vh;background:#E4DEDC;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}body>div{box-shadow:0 12px 40px rgba(17,17,17,.12)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F0EBEA; color: #111111; font-family: 'Inter', 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; padding: 8px 10px 0">
    <a href="Setup.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </header>
  <section style="padding: 4px 20px 0">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">시범 영상 관리</h1>
    <p style="margin: 6px 0 0; font-size: 14px; color: #5F5856">운동마다 직접 찍은 영상을 올려요</p>
  </section>

  <form style="margin: 16px 20px 0; padding: 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 8px 24px rgba(17, 17, 17, 0.07); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ex" style="font-size: 13px; font-weight: 600; color: #5F5856">운동</label>
      <select id="ex" style="height: 52px; border: 0; border-radius: 14px; padding: 0 14px; background: #F0EBEA; color: #111111; font-family: inherit; font-size: 16px; font-weight: 600">
        <option>푸시업</option>
        <option selected>점프 스쿼트</option>
        <option>플랭크</option>
      </select>
    </div>
    <label for="file" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 12px; border: 1.5px dashed #C9C1BF; border-radius: 18px; background: #FAF8F7; text-align: center; cursor: pointer">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #D8F7EE; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C7460" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
      </span>
      <span style="font-size: 15px; font-weight: 700">영상 파일 선택</span>
      <span style="font-size: 12px; color: #5F5856">mp4 · 최대 50MB</span>
      <input id="file" type="file" accept="video/mp4" style="position: absolute; width: 1px; height: 1px; opacity: 0">
    </label>
    <p role="alert" style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #FDECEA; color: #B42318; font-size: 13px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="M15 9l-6 6M9 9l6 6"></path></svg>
      squat.mov는 올릴 수 없어요. mp4만 가능해요.
    </p>
    <button type="button" style="height: 52px; border: 0; border-radius: 16px; background: #4DFFCF; color: #111111; font-family: inherit; font-size: 16px; font-weight: 700; box-shadow: 0 10px 22px rgba(50, 178, 145, 0.35); cursor: pointer">업로드</button>
  </form>

  <section style="margin: 20px 20px 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em">운동 목록</h2>
      <span style="font-size: 13px; color: #5F5856">20개 중 3개 등록</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 2px 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 8px 24px rgba(17, 17, 17, 0.07)">
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0;">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #F6E9E3; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8735C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 700">푸시업</span>
            <span style="font-size: 12px; color: #5F5856">상체</span>
          </div>
          <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #D8F7EE; color: #1C7460;">등록됨</span>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #E8E2E0;">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #D8F7EE; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C7460" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 700">맨몸 스쿼트</span>
            <span style="font-size: 12px; color: #5F5856">하체</span>
          </div>
          <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #D8F7EE; color: #1C7460;">등록됨</span>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #E8E2E0;">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #ECE7E6; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 700">플랭크</span>
            <span style="font-size: 12px; color: #5F5856">코어</span>
          </div>
          <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #D8F7EE; color: #1C7460;">등록됨</span>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #E8E2E0;">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #D8F7EE; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C7460" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 700">점프 스쿼트</span>
            <span style="font-size: 12px; color: #5F5856">하체</span>
          </div>
          <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #E8E2E0; color: #5F5856;">없음</span>
        </li>
      
    </ul>
  </section>
</div>
</body>
</html>
