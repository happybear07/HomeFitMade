<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S4 운동 진행 · 휴식 · 홈핏 메이트 화면 설계</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C7460}
</style>
<style>body{margin:0;min-height:100vh;background:#E4DEDC;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}body>div{box-shadow:0 12px 40px rgba(17,17,17,.12)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #32B291; color: #111111; font-family: 'Inter', 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: 16px 10px 0">
    <a href="Main.html" aria-label="그만하기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="text-align: center; font-size: 14px; font-weight: 600; color: #111111; font-variant-numeric: tabular-nums">1 / 5</span>
    <span></span>
  </header>
  <div role="progressbar" aria-label="루틴 진행: 5개 중 1번째 운동" aria-valuenow="1" aria-valuemin="0" aria-valuemax="5" style="margin: 6px 20px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
    <span style="height: 4px; border-radius: 2px; background: linear-gradient(90deg, #111111 70%, rgba(17, 17, 17, 0.18) 70%)"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(17, 17, 17, 0.18)"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(17, 17, 17, 0.18)"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(17, 17, 17, 0.18)"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(17, 17, 17, 0.18)"></span>
  </div>

  <section style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 232px; height: 232px">
      <svg width="232" height="232" viewBox="0 0 232 232" role="img" aria-label="휴식 45초 중 32초 남음">
        <circle cx="116" cy="116" r="104" fill="none" stroke="rgba(17, 17, 17, 0.15)" stroke-width="12"></circle>
        <circle cx="116" cy="116" r="104" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="188.8" transform="rotate(-90 116 116)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #111111">
        <span style="font-size: 14px; font-weight: 600; color: #111111">휴식</span>
        <span style="font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">0:32</span>
      </div>
    </div>
  </section>

  <main style="padding: 10px 20px 0; border-radius: 32px 32px 0 0; background: #FFFFFF; box-shadow: 0 -10px 32px rgba(0, 0, 0, 0.22); display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D6D0CE"></span>
    <span style="margin-top: 16px; font-size: 13px; font-weight: 600; color: #5F5856">다음 운동</span>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 12px; border-radius: 20px; background: #F0EBEA">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #F6E9E3; display: flex; align-items: center; justify-content: center">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(17, 17, 17, 0.12)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#A8735C" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"></path></svg>
        </span>
      </span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.02em">푸시업</span>
        <span style="font-size: 13px; color: #5F5856; font-variant-numeric: tabular-nums">세트 3 / 3</span>
      </div>
      <span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">17회</span>
    </div>
    <a href="Workout.html" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #4DFFCF; color: #111111; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 10px 22px rgba(50, 178, 145, 0.35)">바로 다음 세트</a>
    <a href="Complete.html" style="align-self: center; padding: 12px; font-size: 13px; font-weight: 500; color: #5F5856">(프로토타입) 완료 화면으로</a>
    <p style="margin: 0 0 14px; font-size: 11px; line-height: 1.5; color: #5F5856; text-align: center">본 프로그램의 추천은 일반적인 운동 안내이며 의학적 조언을 대신하지 않습니다.</p>
  </main>
</div>
</body>
</html>
